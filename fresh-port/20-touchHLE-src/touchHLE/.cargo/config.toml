[build]
# the documentation for the touchHLE crate is intended to include private items
# alas this isn't scoped to that crate!
rustdocflags = ["--document-private-items"]

# ===========================================================================
# WASM 移植(wasm-poc 分支)专属:emscripten link 参数。target-scoped,只影响
# wasm32-unknown-emscripten 构建,五平台(mac/win/linux/android/ios)完全不受影响。
# 让 emcc 用内置 SDL2/OpenAL/WebGL ports 解析 touchHLE 引用的 SDL/AL/GL 符号
# (这是 emscripten 路线的核心红利:现有平台层代码几乎原样链接)。
# ===========================================================================
[target.wasm32-unknown-emscripten]
rustflags = [
  # [WASM] guest 指针对 host 而言常常不是 4/8 字节对齐;touchHLE 拷贝 guest 内存用
  # copy_nonoverlapping(memcpy 语义,任意对齐都正确)。但 rustc 1.78+ 的 std 在 debug 下
  # 加了「指针必须对齐」的 UB 前置断言,会对这些本就安全的拷贝 panic(GL 纹理/像素路径首撞)。
  # rustc 1.96 还没有 -C ub-checks,只能整体关 debug-assertions(= release 对该类检查的行为)。
  # 拷贝运行时完全正确,关掉只是去掉误报。target-scoped 只作用 wasm,五平台零影响。
  "-C", "debug-assertions=off",
  # [WASM 性能] 解释器是逐指令派发的紧循环,opt-level=3 的更激进内联/循环展开正中其工况
  # ([profile.release] 只设了 lto+codegen-units,opt-level 仍是 release 默认的 2)。
  # 用 rustflags 而非 [profile.release] opt-level,只作用 wasm,其余四平台保持各自 release 档。
  "-C", "opt-level=3",
  # [WASM 性能] 启用稳定 wasm 扩展:bulk-memory → 原生 memory.copy/fill(data_w_* 的
  # copy_from_slice、IPA/Mach-O 大块拷贝提速);sign-ext → 原生 i32.extend8_s/16_s
  # (解释器大量符号扩展:asr_c、有符号乘法、LDRSB/LDRSH)。两者所有现代浏览器都支持。
  "-C", "target-feature=+bulk-memory,+sign-ext",
  "-C", "link-arg=-sUSE_SDL=2",
  "-C", "link-arg=-lopenal",
  "-C", "link-arg=-sMAX_WEBGL_VERSION=2",
  "-C", "link-arg=-sMIN_WEBGL_VERSION=2",
  "-C", "link-arg=-sFULL_ES2=1",
  "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
  "-C", "link-arg=-sMAXIMUM_MEMORY=2147483648",
  "-C", "link-arg=-sEXIT_RUNTIME=0",
  # [WASM 性能] release 关 emscripten 运行期断言(栈溢出/对齐/malloc 完整性等),它们在
  # 每次 asyncify 让出 + glue 边界都有开销。touchHLE 自己的 null_segment_size/get_bytes_fallible
  # 检查仍在,安全网不变;调试期要排查再临时改回 1。
  "-C", "link-arg=-sASSERTIONS=0",
  "-C", "link-arg=-sALLOW_TABLE_GROWTH=1",
  # [M1] emscripten fibers(guest 协程栈切换,替 corosensei)必需 ASYNCIFY 插桩。
  "-C", "link-arg=-sASYNCIFY=1",
  # 主上下文 asyncify 栈:run() 在此 emscripten_sleep 让出给浏览器,需足够深。
  "-C", "link-arg=-sASYNCIFY_STACK_SIZE=131072",
  # 导出 Module.FS,供加载器 preRun 把 IPA 写进 MEMFS。
  "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=FS,callMain,ccall",
  # IPA 105MB + guest 1GiB,放宽初始内存。
  "-C", "link-arg=-sINITIAL_MEMORY=536870912",
  # 主 wasm 栈(默认 64KB 太小):加载/解析 105MB IPA + Mach-O + frameworks 调用深。
  "-C", "link-arg=-sSTACK_SIZE=16777216",
  # 把 touchHLE 运行期需要的支持文件烤进 emscripten FS(/touchHLE_dylibs 等):
  # 游戏链接的 iOS 系统 dylib(libstdc++/libgcc/libz)+ 字体 + 默认选项。
  "-C", "link-arg=--preload-file",
  "-C", "link-arg=touchHLE_dylibs",
  "-C", "link-arg=--preload-file",
  "-C", "link-arg=touchHLE_fonts",
  "-C", "link-arg=--preload-file",
  "-C", "link-arg=touchHLE_default_options.txt",
]
