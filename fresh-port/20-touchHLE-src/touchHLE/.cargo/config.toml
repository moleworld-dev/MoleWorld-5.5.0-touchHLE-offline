[build]
# the documentation for the touchHLE crate is intended to include private items
# alas this isn't scoped to that crate!
rustdocflags = ["--document-private-items"]

# ===========================================================================
# WASM 移植(wasm-poc 分支)专属:emscripten link 参数。target-scoped,只影响
# wasm32-unknown-emscripten 构建,五平台(mac/win/linux/android/ios)完全不受影响。
# 让 emcc 用内置 SDL2/OpenAL/WebGL ports 解析 touchHLE 引用的 SDL/AL/GL 符号
# (这是 emscripten 路线的核心红利:现有平台层代码几乎原样链接)。
# ===========================================================================
[target.wasm32-unknown-emscripten]
rustflags = [
  "-C", "link-arg=-sUSE_SDL=2",
  "-C", "link-arg=-lopenal",
  "-C", "link-arg=-sMAX_WEBGL_VERSION=2",
  "-C", "link-arg=-sMIN_WEBGL_VERSION=2",
  "-C", "link-arg=-sFULL_ES2=1",
  "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
  "-C", "link-arg=-sMAXIMUM_MEMORY=2147483648",
  "-C", "link-arg=-sEXIT_RUNTIME=0",
  "-C", "link-arg=-sASSERTIONS=1",
  "-C", "link-arg=-sALLOW_TABLE_GROWTH=1",
  # [M1] emscripten fibers(guest 协程栈切换,替 corosensei)必需 ASYNCIFY 插桩。
  "-C", "link-arg=-sASYNCIFY=1",
  # 主上下文 asyncify 栈:run() 在此 emscripten_sleep 让出给浏览器,需足够深。
  "-C", "link-arg=-sASYNCIFY_STACK_SIZE=131072",
  # 导出 Module.FS,供加载器 preRun 把 IPA 写进 MEMFS。
  "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=FS,callMain,ccall",
  # IPA 105MB + guest 1GiB,放宽初始内存。
  "-C", "link-arg=-sINITIAL_MEMORY=536870912",
  # 主 wasm 栈(默认 64KB 太小):加载/解析 105MB IPA + Mach-O + frameworks 调用深。
  "-C", "link-arg=-sSTACK_SIZE=16777216",
]
