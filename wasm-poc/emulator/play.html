<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摩尔庄园 · 浏览器版(touchHLE WASM)</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
    --accent:#3fb950; --err:#f85149; --warn:#d29922; --dim:#8b949e;
    --logw: 420px;            /* 日志面板宽度 */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ── 顶栏 ── */
  header{
    display:flex; align-items:center; gap:14px;
    padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  header .title{font-weight:600; font-size:14px}
  header .badge{padding:2px 8px; border-radius:10px; background:#21262d; color:var(--dim); font-size:12px}
  header .badge.run{color:var(--accent)}
  header .badge.err{color:var(--err)}
  header .spacer{flex:1}
  header button{
    background:#21262d; color:var(--fg); border:1px solid var(--border);
    border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit;
  }
  header button:hover{background:#30363d}
  /* ── 主区:左游戏 右日志 ── */
  main{flex:1 1 auto; display:flex; min-height:0}
  #stage{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center;
    background:#000; padding:10px; position:relative;
  }
  /* canvas 内部分辨率 1024x768,这里等比缩放铺满左侧、保持 4:3 */
  #canvas{
    width:100% !important; height:100% !important;
    object-fit:contain; background:#000; display:block;
    image-rendering:auto;
  }
  #stage .hint{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    color:var(--dim); font-size:12px; pointer-events:none;
  }
  /* ── 日志面板 ── */
  #logpane{
    flex:0 0 var(--logw); width:var(--logw); display:flex; flex-direction:column;
    background:var(--panel); border-left:1px solid var(--border); min-height:0;
    transition:flex-basis .15s ease, width .15s ease;
  }
  body.log-collapsed #logpane{flex-basis:0; width:0; border-left:none; overflow:hidden}
  #logpane .lhead{
    display:flex; align-items:center; gap:8px; padding:7px 10px;
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  #logpane .lhead .lt{font-weight:600}
  #logpane .lhead .spacer{flex:1}
  #logpane .lhead button{
    background:transparent; color:var(--dim); border:1px solid var(--border);
    border-radius:5px; padding:3px 8px; cursor:pointer; font:inherit; font-size:12px;
  }
  #logpane .lhead button:hover{color:var(--fg); background:#21262d}
  #log{
    flex:1 1 auto; overflow-y:auto; padding:8px 10px; white-space:pre-wrap;
    word-break:break-word; font-size:12px;
  }
  #log .l{color:var(--dim)}
  #log .l.err{color:var(--err)}
  #log .l.warn{color:var(--warn)}
  #log .l.ok{color:var(--accent)}
  #log::-webkit-scrollbar{width:10px}
  #log::-webkit-scrollbar-thumb{background:#30363d; border-radius:5px}
  .filterbar{display:flex; gap:6px; padding:6px 10px; border-bottom:1px solid var(--border); flex:0 0 auto}
  .filterbar input{
    flex:1; background:#0d1117; color:var(--fg); border:1px solid var(--border);
    border-radius:5px; padding:4px 8px; font:inherit; font-size:12px;
  }
  .filterbar label{display:flex; align-items:center; gap:4px; color:var(--dim); font-size:12px; cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="title">🐹 摩尔庄园 · 浏览器版</span>
  <span class="badge" id="status">准备中…</span>
  <span class="badge" id="fps">FPS —</span>
  <span class="badge" id="mips" title="解释器吞吐:每秒执行的 guest 指令数(百万)">— MIPS</span>
  <span class="spacer"></span>
  <button id="reload" title="重新加载页面重启游戏">↻ 重启</button>
  <button id="toggle">≡ 折叠日志</button>
</header>
<main>
  <div id="stage">
    <canvas id="canvas" width="1024" height="768" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="hint" id="hint">下载游戏数据中…(首次约 100MB,请稍候)</div>
  </div>
  <aside id="logpane">
    <div class="lhead">
      <span class="lt">运行日志</span>
      <span class="badge" id="logcount">0</span>
      <span class="spacer"></span>
      <button id="autoscroll-btn" title="自动滚到底部">⤓ 自动滚动:开</button>
      <button id="clearlog">清空</button>
    </div>
    <div class="filterbar">
      <input id="filter" placeholder="过滤日志(关键字)…">
      <label><input type="checkbox" id="erronly"> 只看错误</label>
    </div>
    <div id="log"></div>
  </aside>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status'), fpsEl = $('fps'), mipsEl = $('mips'),
        hintEl = $('hint'), countEl = $('logcount'), filterEl = $('filter'),
        errOnlyEl = $('erronly');
  const MAX_LINES = 4000;          // 日志环形上限,防内存爆
  let lines = [];                  // {t:text, c:class}
  let autoscroll = true;
  let total = 0;

  // ── 折叠 ──
  $('toggle').onclick = () => {
    document.body.classList.toggle('log-collapsed');
    $('toggle').textContent = document.body.classList.contains('log-collapsed')
      ? '≡ 展开日志' : '≡ 折叠日志';
  };
  $('reload').onclick = () => location.reload();
  $('clearlog').onclick = () => { lines = []; total = 0; render(); };
  $('autoscroll-btn').onclick = (e) => {
    autoscroll = !autoscroll;
    e.target.textContent = '⤓ 自动滚动:' + (autoscroll ? '开' : '关');
  };
  filterEl.oninput = render;
  errOnlyEl.onchange = render;
  logEl.onscroll = () => {
    // 用户手动上滚则暂停自动滚动
    const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 30;
    if (!atBottom && autoscroll) { autoscroll = false; $('autoscroll-btn').textContent = '⤓ 自动滚动:关'; }
  };

  function classify(t) {
    if (/panic|abort|error|失败|崩|ABORT|Aborted/i.test(t)) return 'err';
    if (/warn|warning|TODO|未实现|未登记|忽略|unimplemented/i.test(t)) return 'warn';
    if (/达成|成功|done|OK|✓|渲染/i.test(t)) return 'ok';
    return '';
  }

  let renderScheduled = false;
  function scheduleRender(){ if(!renderScheduled){ renderScheduled = true; requestAnimationFrame(()=>{renderScheduled=false; render();}); } }
  function render() {
    const f = filterEl.value.trim();
    const eo = errOnlyEl.checked;
    let arr = lines;
    if (f) arr = arr.filter(l => l.t.includes(f));
    if (eo) arr = arr.filter(l => l.c === 'err');
    logEl.innerHTML = arr.slice(-1500).map(l =>
      `<div class="l ${l.c}">${escapeHtml(l.t)}</div>`).join('');
    countEl.textContent = total;
    if (autoscroll) logEl.scrollTop = logEl.scrollHeight;
  }
  function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function addLog(t) {
    t = String(t);
    total++;
    lines.push({ t, c: classify(t) });
    if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
    // FPS:从游戏自带的 "touchHLE: ... FPS: N.NN" 日志解析
    const m = t.match(/FPS:\s*([\d.]+)/);
    if (m) fpsEl.textContent = 'FPS ' + Math.round(parseFloat(m[1]));
    // MIPS:从解释器仪表 "[MIPS] N.N M instr/s" 解析(解释器吞吐)
    const mm = t.match(/\[MIPS\]\s*([\d.]+)/);
    if (mm) {
      const v = parseFloat(mm[1]);
      mipsEl.textContent = v.toFixed(1) + ' MIPS';
      (window.__mips || (window.__mips = [])).push(v);   // 供无头 harness 读峰值
      console.log(t);
    }
    scheduleRender();
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'badge' + (cls ? ' ' + cls : '');
  }

  // ── emscripten Module ──
  const CB = Date.now();
  window.Module = {
    canvas: $('canvas'),
    // 无参 → 走 app picker;指定 IPA + iPad 横屏右
    arguments: ['/MoleWorld.ipa', '--landscape-right', '--device-family=ipad'],
    locateFile: (p) => p + '?cb=' + CB,
    print:    (t) => addLog(t),
    printErr: (t) => addLog(t),
    onAbort:  (w) => { setStatus('已崩溃', 'err'); addLog('ABORT: ' + w); },
    onRuntimeInitialized: () => { setStatus('运行中', 'run'); hintEl.style.display = 'none'; },
    preRun: [function () {
      try {
        const d = new Uint8Array(window.__ipaBuf);
        Module.FS.writeFile('/MoleWorld.ipa', d);
        addLog('[launcher] IPA 已写入 MEMFS:' + d.length + ' 字节');
      } catch (e) { addLog('[launcher] 写 IPA 失败:' + e); }
      // [离线种子存档] 把真实存档写进 touchHLE 的 wasm 沙盒,让离线 [GameData loadFromLocal] 读到
      // 非空庄园(否则进村是空的、盖不住启动图)。沙盒根 = user_data_base_path()(wasm 上="."→CWD"/")
      // /touchHLE_sandbox/<bundleid>/。userinfo/map 落 Documents、plist 落 Library/Preferences。
      try {
        const SBOX = '/touchHLE_sandbox/com.taomee.MoleWorld';
        const dest = (name) => name.endsWith('.plist')
          ? SBOX + '/Library/Preferences/' + name
          : SBOX + '/Documents/' + name;
        const seeds = window.__seeds || [];
        if (seeds.length) {
          for (const [name, buf] of seeds) {
            const path = dest(name);
            Module.FS.mkdirTree(path.slice(0, path.lastIndexOf('/')));
            Module.FS.writeFile(path, new Uint8Array(buf));
            addLog('[launcher] 种子写入:' + path + ' (' + buf.byteLength + ' 字节)');
          }
        } else {
          addLog('[launcher] 无种子存档 → 进村为空');
        }
      } catch (e) { addLog('[launcher] 写种子存档失败:' + e); }
    }],
  };

  (async () => {
    addLog('[launcher] 页面加载 ' + new Date().toLocaleString());
    setStatus('下载游戏数据…');
    try {
      const resp = await fetch('MoleWorld.ipa?cb=' + CB);
      if (!resp.ok) throw new Error('HTTP ' + resp.status + '(MoleWorld.ipa 没放在同目录?)');
      window.__ipaBuf = await resp.arrayBuffer();
      addLog('[launcher] IPA 下载完成:' + window.__ipaBuf.byteLength + ' 字节');
      // [离线种子存档] 同目录可选的真实存档,fetch 到内存留给 preRun 写进沙盒(没有就跳过,不影响启动)。
      //   userinfo.dat / map.dat              → Documents/
      //   com.taomee.MoleWorld.plist          → Library/Preferences/(NSUserDefaults:isEncrypt/EV130/userId…)
      // 三件必须配套:userinfo 是加密的,但「是否加密」标志存在 NSUserDefaults 里——少了 plist,
      // GameSettings.isEncrypt=NO → loadUserInfoData 误判「本地存档损坏」弹框 + exit。
      window.__seeds = [];
      for (const name of ['userinfo.dat', 'map.dat', 'com.taomee.MoleWorld.plist']) {
        try {
          const r = await fetch(name + '?cb=' + CB);
          if (r.ok) { const buf = await r.arrayBuffer(); window.__seeds.push([name, buf]);
            addLog('[launcher] 种子下载:' + name + ' ' + buf.byteLength + ' 字节'); }
        } catch (e) { /* 无该种子,可接受 */ }
      }
    } catch (e) {
      setStatus('加载失败', 'err');
      hintEl.textContent = '加载 MoleWorld.ipa 失败:' + e.message;
      addLog('[launcher] ' + e); return;
    }
    setStatus('启动模拟器…');
    hintEl.textContent = '启动中…(debug 构建较慢,首屏可能要十几秒)';
    const s = document.createElement('script');
    s.src = 'touchHLE.js?cb=' + CB;
    s.onerror = () => { setStatus('加载失败', 'err'); addLog('[launcher] touchHLE.js 加载失败'); };
    document.body.appendChild(s);
  })();
})();
</script>
</body>
</html>
