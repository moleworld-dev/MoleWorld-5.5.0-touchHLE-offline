<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摩尔庄园 · 浏览器版(touchHLE WASM)</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
    --accent:#3fb950; --err:#f85149; --warn:#d29922; --dim:#8b949e;
    --logw: 420px;            /* 日志面板宽度 */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ── 顶栏 ── */
  header{
    display:flex; align-items:center; gap:14px;
    padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  /* 2026-10-08 服主:顶栏(标题、状态、帧率、指令数、重启、日志)对玩家没用,整条隐藏;元素留着给脚本用,
     重启由外层页面的「重新加载游戏」负责 */
  header{display:none !important}
  header .title{font-weight:600; font-size:14px}
  header .badge{padding:2px 8px; border-radius:10px; background:#21262d; color:var(--dim); font-size:12px}
  header .badge.run{color:var(--accent)}
  header .badge.err{color:var(--err)}
  header .spacer{flex:1}
  header button{
    background:#21262d; color:var(--fg); border:1px solid var(--border);
    border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit;
  }
  header button:hover{background:#30363d}
  /* ── 主区:左游戏 右日志 ── */
  main{flex:1 1 auto; display:flex; min-height:0}
  #stage{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center;
    background:#000; padding:10px; position:relative;
  }
  /* canvas 内部分辨率 1024x768(4:3)。★触摸精准 + 全屏不错位修复:不能用 width/height:100% +
     object-fit:contain —— 那样 canvas【元素】填满 #stage(非 4:3),画面 letterbox 在元素框内部,
     而 emscripten 把浏览器指针按【元素全框】线性映射到内部分辨率,框内黑边没被算进去 → 触摸坐标
     整体偏移。改成让 canvas 元素本身恒为 4:3、取 #stage 内最大的 4:3 框居中(#stage 已 flex 居中),
     元素框 == 画面 → emscripten 映射准确(触摸精准);全屏/退出时 #stage 变形,元素恒 4:3 也不错位。 */
  #canvas{
    width:auto !important; height:auto !important;
    max-width:100% !important; max-height:100% !important;
    aspect-ratio:4 / 3;
    background:#000; display:block;
    image-rendering:auto;
  }
  #stage .hint{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    color:var(--dim); font-size:12px; pointer-events:none;
  }
  /* ── 启动画面(下载进度):盖在 canvas 上,运行时就绪后淡出 ── */
  #splash{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:15px;
    background:radial-gradient(circle at 50% 38%, #123048, #0d1117 72%);
    transition:opacity .45s ease;
  }
  #splash.hide{opacity:0; pointer-events:none}
  #splash .sp-logo{font-size:58px; line-height:1; animation:sp-bob 1.7s ease-in-out infinite}
  @keyframes sp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
  #splash .sp-title{font-size:18px; font-weight:600; letter-spacing:1px; color:var(--fg)}
  #splash .sp-bar{
    width:min(72%,440px); height:11px; background:#1c2430; border:1px solid var(--border);
    border-radius:7px; overflow:hidden;
  }
  #splash .sp-fill{
    height:100%; width:0%; border-radius:7px;
    background:linear-gradient(90deg,#2ea043,#3fb950); transition:width .25s ease;
  }
  #splash .sp-pct{font-size:14px; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:.5px}
  #splash .sp-note{font-size:12px; color:var(--dim); max-width:82%; text-align:center; line-height:1.7}
  #splash .sp-note.err{color:var(--err)}
  /* ── 日志面板 ── */
  #logpane{
    flex:0 0 var(--logw); width:var(--logw); display:flex; flex-direction:column;
    background:var(--panel); border-left:1px solid var(--border); min-height:0;
    transition:flex-basis .15s ease, width .15s ease;
  }
  body.log-collapsed #logpane{flex-basis:0; width:0; border-left:none; overflow:hidden}
  #logpane .lhead{
    display:flex; align-items:center; gap:8px; padding:7px 10px;
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  #logpane .lhead .lt{font-weight:600}
  #logpane .lhead .spacer{flex:1}
  #logpane .lhead button{
    background:transparent; color:var(--dim); border:1px solid var(--border);
    border-radius:5px; padding:3px 8px; cursor:pointer; font:inherit; font-size:12px;
  }
  #logpane .lhead button:hover{color:var(--fg); background:#21262d}
  #log{
    flex:1 1 auto; min-height:0; overflow-y:auto; padding:8px 10px; white-space:pre-wrap;
    word-break:break-word; font-size:12px;
  }
  #log .l{color:var(--dim)}
  #log .l.err{color:var(--err)}
  #log .l.warn{color:var(--warn)}
  #log .l.ok{color:var(--accent)}
  #log::-webkit-scrollbar{width:10px}
  #log::-webkit-scrollbar-thumb{background:#30363d; border-radius:5px}
  .filterbar{display:flex; gap:6px; padding:6px 10px; border-bottom:1px solid var(--border); flex:0 0 auto}
  .filterbar input{
    flex:1; background:#0d1117; color:var(--fg); border:1px solid var(--border);
    border-radius:5px; padding:4px 8px; font:inherit; font-size:12px;
  }
  .filterbar label{display:flex; align-items:center; gap:4px; color:var(--dim); font-size:12px; cursor:pointer}
  /* ── 存档管理面板(日志下,可折叠)── */
  #savepane{
    border-top:1px solid var(--border); flex:0 0 auto;
    display:flex; flex-direction:column; min-height:0; background:var(--panel);
  }
  #savepane .shead{
    display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer;
    user-select:none; flex:0 0 auto;
  }
  #savepane .shead:hover{background:#1c2128}
  #savepane .shead .caret{display:inline-block; transition:transform .15s ease; color:var(--dim); width:12px}
  #savepane.open .shead .caret{transform:rotate(90deg)}
  #savepane .shead .st{font-weight:600}
  #savepane .shead .spacer{flex:1}
  #savepane .shead .sub{color:var(--dim); font-size:11px}
  #savepane .sbody{display:none; flex-direction:column; gap:10px; padding:4px 10px 12px; overflow-y:auto; max-height:48vh}
  #savepane.open .sbody{display:flex}
  #savepane .sbody::-webkit-scrollbar{width:10px}
  #savepane .sbody::-webkit-scrollbar-thumb{background:#30363d; border-radius:5px}
  .sgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .sbtn{
    background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px;
    padding:7px 8px; cursor:pointer; font:inherit; font-size:12px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .sbtn:hover{background:#30363d}
  .sbtn:disabled{opacity:.45; cursor:not-allowed}
  .sbtn.danger{border-color:#6e2b2b}
  .sbtn.danger:hover{background:#3d1d1d}
  .sbtn.primary{border-color:#2ea043; background:#1a3322}
  .sbtn.primary:hover{background:#22402a}
  .srow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim)}
  .srow .sw{flex:1}
  .stoggle{
    display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--fg); font-size:12px;
  }
  .sstatus{font-size:11px; color:var(--dim); line-height:1.6}
  .sstatus b{color:var(--accent); font-weight:600}
  .sstatus .warnv{color:var(--warn)}
  .ssection-t{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-top:2px}
  .sfiles{display:flex; flex-direction:column; gap:4px}
  .sfile{border:1px solid var(--border); border-radius:6px; overflow:hidden}
  .sfile .fh{display:flex; align-items:center; gap:8px; padding:5px 8px; cursor:pointer; font-size:12px}
  .sfile .fh:hover{background:#1c2128}
  .sfile .fh .fp{flex:1; word-break:break-all}
  .sfile .fh .fsz{color:var(--dim); font-size:11px; white-space:nowrap}
  .sfile .fh .ftag{font-size:10px; padding:1px 6px; border-radius:8px; background:#21262d; color:var(--dim)}
  .sfile .fbody{display:none; border-top:1px solid var(--border); padding:6px 8px; background:#0d1117}
  .sfile.open .fbody{display:block}
  .sfile .fbody .kv{font-size:11px; color:var(--fg); margin-bottom:6px; white-space:pre-wrap; word-break:break-all}
  .sfile .fbody .hex{font-size:11px; color:var(--dim); white-space:pre; overflow-x:auto; line-height:1.45}
  .sempty{color:var(--dim); font-size:12px; padding:6px 0}
</style>
</head>
<body class="log-collapsed">
<header>
  <span class="title">摩尔庄园 · 浏览器版</span>
  <span class="badge" id="status">准备中…</span>
  <span class="badge" id="fps">FPS —</span>
  <span class="badge" id="mips" title="解释器吞吐:每秒执行的 guest 指令数(百万)">— MIPS</span>
  <span class="spacer"></span>
  <button id="reload" title="重新加载页面重启游戏">重启</button>
  <button id="toggle">展开日志</button>
</header>
<main>
  <div id="stage">
    <canvas id="canvas" width="1024" height="768" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="hint" id="hint">下载游戏数据中…(首次约 100MB,请稍候)</div>
    <div id="splash">
      <div class="sp-bar"><div class="sp-fill" id="sp-fill"></div></div>
      <div class="sp-pct" id="sp-pct">准备中…</div>
      <div class="sp-note" id="sp-note">正在下载游戏数据(已启用压缩;再次访问将走缓存,秒开)</div>
    </div>
  </div>
  <aside id="logpane">
    <div class="lhead">
      <span class="lt">运行日志</span>
      <span class="badge" id="logcount">0</span>
      <span class="spacer"></span>
      <button id="autoscroll-btn" title="自动滚到底部">⤓ 自动滚动:开</button>
      <button id="clearlog">清空</button>
    </div>
    <div class="filterbar">
      <input id="filter" placeholder="过滤日志(关键字)…">
      <label><input type="checkbox" id="erronly"> 只看错误</label>
    </div>
    <div id="log"></div>
    <section id="savepane">
      <div class="shead" id="stoggle">
        <span class="caret">▶</span>
        <span class="st">存档管理</span>
        <span class="spacer"></span>
        <span class="sub" id="ssub">点击展开</span>
      </div>
      <div class="sbody">
        <div class="sstatus" id="sstatus">读取存档状态…</div>
        <div class="sgrid">
          <button class="sbtn primary" id="sb-export" title="把当前存档(进度)下载成一个文件备份">⬇ 导出存档</button>
          <button class="sbtn" id="sb-import" title="导入存档:可选原版 userinfo.dat / map.dat / plist(可多选)或 .molesave 备份;只传 map/userinfo 时其余沿用当前存档。会重启游戏">⬆ 导入存档</button>
          <button class="sbtn" id="sb-save" title="立即把当前进度写入浏览器持久化(刷新不丢)">立即保存</button>
          <button class="sbtn danger" id="sb-reset" title="清除持久化存档,恢复默认初始存档(会重启游戏)">↺ 恢复默认</button>
          <button class="sbtn" id="sb-undo" title="从最近一次备份(重置/导入/覆盖前自动留存)恢复存档" disabled>↩ 撤销(恢复备份)</button>
        </div>
        <label class="stoggle" title="开启后游戏进度自动写入浏览器 IndexedDB,刷新页面不丢失">
          <input type="checkbox" id="sb-auto" checked> 自动保存进度(刷新不丢失)
        </label>
        <div class="ssection-t">存档浏览</div>
        <div class="srow">
          <span class="sw" id="sbrowse-hint">展开后点「刷新」查看沙盒内存档文件</span>
          <button class="sbtn" id="sb-browse" style="flex:0 0 auto; padding:4px 10px">刷新</button>
        </div>
        <div class="sfiles" id="sfiles"></div>
      </div>
      <input type="file" id="sb-file" accept=".molesave,.json,.dat,.plist" multiple style="display:none">
    </section>
  </aside>
</main>

<script>
(() => {
  // [画面闪烁根治] WebGL 默认 preserveDrawingBuffer=false:浏览器每次合成后清 canvas;游戏稳态 ~15fps
  // 而浏览器 ~60Hz,中间没有新 swap 的浏览器帧会合成到【被清空的黑 canvas】→ 黑帧穿插=闪来闪去。
  // 强制 preserveDrawingBuffer:true 让 canvas 保留上一帧、两次 swap 之间不变黑(实测亮度大跳变 46→5)。
  // 在 emscripten 创建 WebGL 上下文【之前】包一层 getContext 即可注入该属性。alpha:false=不透明 canvas。
  (function () {
    const orig = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      if (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl') {
        attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true, alpha: false });
      }
      return orig.call(this, type, attrs);
    };
  })();
  // [音频] 浏览器策略:AudioContext 创建即处于 suspended,必须在【用户手势之后】resume 才出声;
  // emscripten 的 OpenAL/SDL 音频上下文同受此限(控制台原本恒报 "AudioContext was not allowed to
  // start. It must be resumed after a user gesture")。包一层 AudioContext 构造收集所有实例,首次用户
  // 交互(点/触/键)时全部 resume,游戏音乐/音效即可出声。在 emscripten 创建音频上下文之前装好。
  (function () {
    const Native = window.AudioContext || window.webkitAudioContext;
    if (!Native) return;
    const all = [];
    const Patched = function (...args) {
      const ctx = new Native(...args);
      all.push(ctx);
      return ctx;
    };
    Patched.prototype = Native.prototype;
    window.AudioContext = Patched;
    if (window.webkitAudioContext) window.webkitAudioContext = Patched;
    const resumeAll = () => {
      for (const c of all) {
        if (c.state === 'suspended' && c.resume) c.resume().catch(() => {});
      }
    };
    for (const ev of ['pointerdown', 'touchstart', 'keydown', 'click']) {
      window.addEventListener(ev, resumeAll, { capture: true });
    }
  })();
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status'), fpsEl = $('fps'), mipsEl = $('mips'),
        hintEl = $('hint'), countEl = $('logcount'), filterEl = $('filter'),
        errOnlyEl = $('erronly');
  const MAX_LINES = 4000;          // 日志环形上限,防内存爆
  let lines = [];                  // {t:text, c:class}
  let autoscroll = true;
  let total = 0;

  // ── 折叠 ──
  $('toggle').onclick = () => {
    document.body.classList.toggle('log-collapsed');
    $('toggle').textContent = document.body.classList.contains('log-collapsed')
      ? '展开日志' : '折叠日志';
  };
  $('reload').onclick = () => location.reload();
  $('clearlog').onclick = () => { lines = []; total = 0; render(); };
  $('autoscroll-btn').onclick = (e) => {
    autoscroll = !autoscroll;
    e.target.textContent = '⤓ 自动滚动:' + (autoscroll ? '开' : '关');
  };
  filterEl.oninput = render;
  errOnlyEl.onchange = render;
  logEl.onscroll = () => {
    // 用户手动上滚则暂停自动滚动
    const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 30;
    if (!atBottom && autoscroll) { autoscroll = false; $('autoscroll-btn').textContent = '⤓ 自动滚动:关'; }
  };

  function classify(t) {
    if (/panic|abort|error|失败|崩|ABORT|Aborted/i.test(t)) return 'err';
    if (/warn|warning|TODO|未实现|未登记|忽略|unimplemented/i.test(t)) return 'warn';
    if (/达成|成功|done|OK|✓|渲染/i.test(t)) return 'ok';
    return '';
  }

  let renderScheduled = false;
  function scheduleRender(){ if(!renderScheduled){ renderScheduled = true; requestAnimationFrame(()=>{renderScheduled=false; render();}); } }
  function render() {
    const f = filterEl.value.trim();
    const eo = errOnlyEl.checked;
    let arr = lines;
    if (f) arr = arr.filter(l => l.t.includes(f));
    if (eo) arr = arr.filter(l => l.c === 'err');
    logEl.innerHTML = arr.slice(-1500).map(l =>
      `<div class="l ${l.c}">${escapeHtml(l.t)}</div>`).join('');
    countEl.textContent = total;
    if (autoscroll) logEl.scrollTop = logEl.scrollHeight;
  }
  function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function addLog(t) {
    t = String(t);
    total++;
    lines.push({ t, c: classify(t) });
    if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
    // FPS:从游戏自带的 "touchHLE: ... FPS: N.NN" 日志解析
    const m = t.match(/FPS:\s*([\d.]+)/);
    if (m) fpsEl.textContent = 'FPS ' + Math.round(parseFloat(m[1]));
    // MIPS:从解释器仪表 "[MIPS] N.N M instr/s" 解析(解释器吞吐)
    const mm = t.match(/\[MIPS\]\s*([\d.]+)/);
    if (mm) {
      const v = parseFloat(mm[1]);
      mipsEl.textContent = v.toFixed(1) + ' MIPS';
      (window.__mips || (window.__mips = [])).push(v);   // 供无头 harness 读峰值
      console.log(t);
    }
    scheduleRender();
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'badge' + (cls ? ' ' + cls : '');
  }

  // ═══════════════════════════════════════════════════════════════════════
  //  存档管理:IndexedDB 持久化 + 导入/导出/重置/浏览
  //  wasm 版文件系统是 MEMFS(内存),刷新即丢——这里把沙盒里的存档文件镜像到
  //  IndexedDB:页面加载时优先用它当种子(进度刷新不丢),并提供手动导入/导出/重置/浏览。
  // ═══════════════════════════════════════════════════════════════════════
  const SBOX = '/touchHLE_sandbox/com.taomee.MoleWorld';
  // 默认种子文件名 → 沙盒相对路径(plist 落 Library/Preferences,其余落 Documents)
  const SAVE_REL = (name) => name.endsWith('.plist')
    ? 'Library/Preferences/' + name : 'Documents/' + name;

  // ---- IndexedDB:存玩家存档镜像(key='player')----
  const saveDB = {
    _db: null,
    open() {
      if (this._db) return Promise.resolve(this._db);
      return new Promise((res, rej) => {
        const rq = indexedDB.open('moleworld-saves', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { this._db = rq.result; res(this._db); };
        rq.onerror = () => rej(rq.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const rq = db.transaction('kv').objectStore('kv').get(key);
        rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error);
      });
    },
    async put(key, val) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key);
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
      });
    },
    async del(key) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(key);
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
      });
    },
  };

  // ---- 沙盒文件读写(运行时就绪后可用)----
  const runtimeReady = () => !!(window.__runtimeReady && window.Module && Module.FS);
  // 只把真实存档目录纳入持久化/导出/浏览:跳过 Library/Caches(SDK 缓存,会无界膨胀 + 缓存一变就
  // 触发整包误存)和 tmp(引擎启动即清空,持久化纯浪费)。存档只在 Documents/ 与 Library/Preferences/。
  const SAVE_DIR_RE = /^(Documents\/|Library\/Preferences\/)/;
  function listSandboxFiles() {
    const out = [];
    if (!runtimeReady()) return out;
    const FS = Module.FS;
    (function walk(dir) {
      let entries; try { entries = FS.readdir(dir); } catch (e) { return; }
      for (const e of entries) {
        if (e === '.' || e === '..') continue;
        const p = dir + '/' + e;
        let st; try { st = FS.stat(p); } catch (_) { continue; }
        if (FS.isDir(st.mode)) walk(p);
        else { const rel = p.slice(SBOX.length + 1);
          if (SAVE_DIR_RE.test(rel)) { try { out.push({ path: rel, data: FS.readFile(p) }); } catch (_) {} } }
      }
    })(SBOX);
    return out;
  }

  // ---- base64(导出文件用)/ 大小格式化 ----
  function bytesToB64(u8) {
    let s = ''; const C = 0x8000;
    for (let i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i + C));
    return btoa(s);
  }
  function b64ToBytes(b64) {
    const s = atob(b64), u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }
  const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
  // 沙盒相对路径白名单:防导入的 .molesave 用 ../、绝对路径、反斜杠等逃出沙盒目录(MEMFS 里也不该越界)。
  const safeRelPath = (p) => typeof p === 'string' && p.length > 0 && p.length < 256
    && !p.startsWith('/') && !p.split('/').includes('..') && !p.includes('\\') && !p.includes('\0');

  // ---- 持久化:把沙盒存档镜像进 IndexedDB ----
  let lastSaveTime = 0, lastSaveSig = '', saveFailed = false;
  // 内容指纹用 FNV-1a(不能只用 path+length:userinfo.dat 是定长 AES 块,等级/金币变了但字节数不变,
  // 只比长度会漏存 → 刷新丢进度)。~15KB 全量哈希极廉价。
  function fnv1a(u8) { let h = 0x811c9dc5; for (let i = 0; i < u8.length; i++) { h ^= u8[i]; h = (h * 0x01000193) >>> 0; } return h; }
  const filesSig = (files) => files.map(f => f.path + ':' + f.data.length + ':' + fnv1a(f.data)).sort().join('|');
  // 一份沙盒快照是否「像有效存档」:至少含非空 userinfo.dat(核心档)。空沙盒/半截写盘不该落盘覆盖好存档。
  const snapshotValid = (files) => { const u = files.find(f => f.path.endsWith('userinfo.dat')); return !!(u && u.data.length > 16); };
  async function persistNow(reason, force) {
    if (!runtimeReady()) return false;
    const files = listSandboxFiles();
    if (!files.length || !snapshotValid(files)) return false;   // 空/缺核心档/半截:绝不覆盖已存进度
    const sig = filesSig(files);
    if (!force && sig === lastSaveSig) return false;            // 内容没变,不重复写
    try {
      const prev = await saveDB.get('player');
      if (prev && prev.files && prev.files.length) {
        const pT = prev.files.reduce((a, f) => a + f.data.length, 0);
        const nT = files.reduce((a, f) => a + f.data.length, 0);
        // 不退化守卫(仅自动保存):新快照文件更少 或 总字节腰斩 = 疑似游戏没加载好/写盘中间态,
        // 拒绝用它覆盖玩家已存的好进度(手动「立即保存」可强制)。
        if (!force && (files.length < prev.files.length || nT < pT * 0.5)) {
          addLog('[存档] 跳过自动保存:当前沙盒疑似不完整,保护已存进度不被覆盖'); return false;
        }
        try { await saveDB.put('player.bak', prev); } catch (_) {}   // 覆盖前留一份回滚副本(可「撤销」)
      }
      await saveDB.put('player', { files, created: new Date().toISOString(), source: reason || 'auto' });
      lastSaveSig = sig; lastSaveTime = Date.now(); saveFailed = false; refreshStatus(); updateBakBtn(); return true;
    } catch (e) { saveFailed = true; addLog('[存档] 持久化失败(存储被拒/配额满?):' + e); refreshStatus(); return false; }
  }

  // ---- 状态行 ----
  function refreshStatus() {
    const el = $('sstatus'); if (!el) return;
    const auto = $('sb-auto').checked;
    const t = lastSaveTime ? new Date(lastSaveTime).toLocaleTimeString() : '尚未';
    const files = runtimeReady() ? listSandboxFiles() : [];
    const total = files.reduce((a, f) => a + f.data.length, 0);
    const src = window.__saveSource || (window.__seeds === undefined ? '读取中…' : '默认种子');
    el.innerHTML =
      (saveFailed ? '<span class="warnv">自动保存失败(存储被拒/配额满)— 请用「导出存档」手动备份!</span><br>' : '') +
      '存档来源:<b>' + src + '</b>　自动保存:' + (auto ? '<b>开</b>' : '<span class="warnv">关</span>') +
      '<br>当前沙盒:' + (files.length ? files.length + ' 文件 / ' + fmtSize(total) : '<span class="warnv">游戏未就绪</span>') +
      '　上次保存:' + t;
    $('ssub').textContent = files.length ? (files.length + ' 文件') : (auto ? '自动:开' : '自动:关');
  }

  // ---- 存档浏览(文件列表 + 摘要 + 十六进制)----
  function printableStrings(u8, min, max) {
    min = min || 4; max = max || 50; const res = []; let cur = '';
    for (let i = 0; i < u8.length && res.length < max; i++) {
      const c = u8[i];
      if (c >= 0x20 && c < 0x7f) cur += String.fromCharCode(c);
      else { if (cur.length >= min) res.push(cur); cur = ''; }
    }
    if (cur.length >= min && res.length < max) res.push(cur);
    return res;
  }
  function hexDump(u8, n) {
    n = Math.min(n || 256, u8.length); let out = '';
    for (let i = 0; i < n; i += 16) {
      let hex = '', asc = '';
      for (let j = 0; j < 16; j++) {
        if (i + j < n) { const b = u8[i + j]; hex += b.toString(16).padStart(2, '0') + ' ';
          asc += (b >= 0x20 && b < 0x7f) ? String.fromCharCode(b) : '.'; }
        else hex += '   ';
      }
      out += i.toString(16).padStart(4, '0') + '  ' + hex + ' ' + asc + '\n';
    }
    if (u8.length > n) out += '… 共 ' + u8.length + ' 字节,仅显示前 ' + n + '\n';
    return out;
  }
  function decodeFileMeta(path, u8) {
    const head6 = u8.length >= 6 ? String.fromCharCode(u8[0], u8[1], u8[2], u8[3], u8[4], u8[5]) : '';
    const isBplist = head6 === 'bplist';
    if (path.endsWith('.plist'))
      return { tag: isBplist ? 'bplist' : 'plist',
        kv: 'NSUserDefaults(设置/账号标志:isEncrypt/userId 等)\n可读串:' + printableStrings(u8, 3, 24).join('  ') };
    if (path.endsWith('map.dat'))
      return { tag: isBplist ? 'bplist·明文' : '明文', kv: '庄园地图(建筑/装饰布局,明文 bplist)' };
    if (path.endsWith('userinfo.dat'))
      return { tag: 'AES 加密', kv: '玩家信息存档(等级/金币/贝壳/经验等;AES-128-ECB 加密,需游戏内解密)' };
    return { tag: '二进制', kv: '' };
  }
  function renderBrowse() {
    const box = $('sfiles'); if (!box) return;
    if (!runtimeReady()) { box.innerHTML = '<div class="sempty">游戏还没就绪,进村后再刷新</div>'; return; }
    const files = listSandboxFiles();
    if (!files.length) { box.innerHTML = '<div class="sempty">沙盒里暂无存档文件</div>'; return; }
    box.innerHTML = '';
    for (const f of files) {
      const meta = decodeFileMeta(f.path, f.data);
      const el = document.createElement('div'); el.className = 'sfile';
      el.innerHTML =
        '<div class="fh"><span class="fp">' + escapeHtml(f.path) + '</span>' +
        '<span class="ftag">' + meta.tag + '</span><span class="fsz">' + fmtSize(f.data.length) + '</span></div>' +
        '<div class="fbody"><div class="kv">' + escapeHtml(meta.kv || '(无摘要)') + '</div>' +
        '<div class="hex">' + escapeHtml(hexDump(f.data, 256)) + '</div></div>';
      el.querySelector('.fh').onclick = () => el.classList.toggle('open');
      box.appendChild(el);
    }
  }
  function flash(btn, txt) { const old = btn.textContent; btn.textContent = txt; setTimeout(() => btn.textContent = old, 1200); }

  // ---- 面板事件接线 ----
  function setupSaveManager() {
    $('stoggle').onclick = () => {
      const p = $('savepane'); p.classList.toggle('open');
      if (p.classList.contains('open')) { refreshStatus(); renderBrowse(); }
    };
    $('sb-export').onclick = () => {
      if (!runtimeReady()) return alert('游戏还没就绪,进村后再导出');
      const files = listSandboxFiles();
      if (!files.length) return alert('当前没有可导出的存档');
      const bundle = { format: 'moleworld-save', version: 1, created: new Date().toISOString(),
        bundleId: 'com.taomee.MoleWorld',
        files: files.map(f => ({ path: f.path, size: f.data.length, b64: bytesToB64(f.data) })) };
      const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'moleworld-存档-' + new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19) + '.molesave';
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      addLog('[存档] 已导出 ' + files.length + ' 个文件'); flash($('sb-export'), '✓ 已导出');
    };
    $('sb-import').onclick = () => $('sb-file').click();
    // 原版客户端存档文件名 → 沙盒相对路径(支持直接导入真机/原版 userinfo.dat / map.dat / plist)
    const importRelFor = (name) => {
      const n = name.toLowerCase();
      if (n.endsWith('userinfo.dat')) return 'Documents/userinfo.dat';
      if (n.endsWith('map.dat')) return 'Documents/map.dat';
      if (n.endsWith('.plist')) return 'Library/Preferences/com.taomee.MoleWorld.plist';
      return null;
    };
    $('sb-file').onchange = async (e) => {
      const picked = Array.from(e.target.files || []); if (!picked.length) return; e.target.value = '';
      try {
        const incoming = [], names = [];   // incoming: {path, data}
        for (const file of picked) {
          const lower = file.name.toLowerCase();
          if (lower.endsWith('.molesave') || lower.endsWith('.json')) {
            // 我们自己导出的 .molesave 包(JSON + base64)
            const bundle = JSON.parse(await file.text());
            if (bundle.format !== 'moleworld-save' || !Array.isArray(bundle.files))
              throw new Error('「' + file.name + '」不是有效的 .molesave 包');
            for (const f of bundle.files) {
              if (!safeRelPath(f.path)) throw new Error('「' + file.name + '」含非法路径');
              incoming.push({ path: f.path, data: b64ToBytes(f.b64) });
            }
            names.push(file.name);
          } else {
            // 原版客户端存档 .dat / .plist —— 按文件名映射到沙盒路径,直接导入
            const rel = importRelFor(file.name);
            if (!rel) throw new Error('不认识的存档文件「' + file.name + '」\n支持:userinfo.dat / map.dat / com.taomee.MoleWorld.plist / .molesave');
            incoming.push({ path: rel, data: new Uint8Array(await file.arrayBuffer()) });
            names.push(file.name);
          }
        }
        if (!incoming.length) throw new Error('没有可导入的文件');
        const totalBytes = incoming.reduce((a, f) => a + f.data.length, 0);
        if (incoming.length > 64) throw new Error('文件过多');
        if (totalBytes > 64 * 1048576) throw new Error('文件过大(' + fmtSize(totalBytes) + ')');
        // ★叠加到当前存档:只提供 map/userinfo 时,plist 等其余文件保留现有(种子) → 三件套齐全可加载。
        const base = runtimeReady() ? listSandboxFiles() : ((await saveDB.get('player'))?.files || []);
        const byPath = new Map(base.map(f => [f.path, f.data]));
        for (const f of incoming) byPath.set(f.path, f.data);
        const merged = [...byPath.entries()].map(([path, data]) => ({ path, data }));
        if (!merged.some(f => f.path.endsWith('userinfo.dat'))) throw new Error('导入后缺 userinfo.dat,无法加载');
        if (!confirm('导入 ' + names.join(' + ') + '(' + fmtSize(totalBytes) + ')?\n会覆盖对应存档并重启游戏。\n(只传了 map/userinfo 的话,其余沿用当前存档)')) return;
        try { const cur = await saveDB.get('player'); if (cur) await saveDB.put('player.bak', cur); } catch (_) {}
        await saveDB.put('player', { files: merged, created: new Date().toISOString(), source: '导入:' + names.join(',') });
        addLog('[存档] 已导入(' + names.join(', ') + '),旧档备份到 player.bak,重启游戏…'); location.reload();
      } catch (err) { alert('导入失败:' + err.message); addLog('[存档] 导入失败:' + err); }
    };
    $('sb-save').onclick = async () => {
      if (!runtimeReady()) return alert('游戏还没就绪');
      const ok = await persistNow('手动', true);
      addLog(ok ? '[存档] 已手动保存进度到浏览器' : '[存档] 保存失败(沙盒为空)');
      if (ok) flash($('sb-save'), '✓ 已保存');
    };
    $('sb-reset').onclick = async () => {
      if (!confirm('恢复默认存档?\n会清除浏览器里保存的进度、用初始存档重启游戏。\n旧档会留一份备份(可「撤销」找回);也建议先「导出存档」。')) return;
      try { const cur = await saveDB.get('player'); if (cur) await saveDB.put('player.bak', cur); } catch (_) {}
      await saveDB.del('player');
      addLog('[存档] 已清除持久化存档(旧档备份到 player.bak),恢复默认并重启…'); location.reload();
    };
    $('sb-auto').onchange = () => {
      localStorage.setItem('mole_autosave', $('sb-auto').checked ? '1' : '0');
      refreshStatus(); addLog('[存档] 自动保存:' + ($('sb-auto').checked ? '开' : '关'));
    };
    $('sb-browse').onclick = renderBrowse;
    $('sb-undo').onclick = async () => {
      try {
        const bak = await saveDB.get('player.bak');
        if (!bak || !bak.files || !bak.files.length) return alert('没有可恢复的备份');
        if (!confirm('从最近一次备份恢复存档?会覆盖当前进度并重启游戏。')) return;
        await saveDB.put('player', bak);
        addLog('[存档] 已从备份恢复,重启游戏…'); location.reload();
      } catch (e) { alert('恢复备份失败:' + e); }
    };
    if (localStorage.getItem('mole_autosave') === '0') $('sb-auto').checked = false;
    refreshStatus(); updateBakBtn();
  }
  async function updateBakBtn() {
    const btn = $('sb-undo'); if (!btn) return;
    try { const bak = await saveDB.get('player.bak'); btn.disabled = !(bak && bak.files && bak.files.length); }
    catch (_) { btn.disabled = true; }
  }
  // 自动保存:定时 + 切到后台/隐藏时各存一次(刷新前的最后一道保险)
  function startAutoPersist() {
    setInterval(() => { if ($('sb-auto').checked) persistNow('auto'); }, 12000);
    document.addEventListener('visibilitychange', () => { if (document.hidden && $('sb-auto').checked) persistNow('auto'); });
  }

  // ── emscripten Module ──
  // 缓存键分两档(部署时各自 sed 成固定串):
  //   CB     = 引擎构建号 —— wasm/data/js/index/种子 用它,引擎每次更新就 bump,触发这些(共 ~27MB)重下。
  //   IPA_CB = 游戏包(IPA)版本 —— IPA 是游戏本体美术/音频 97MB,内容极少变。给它独立 key,
  //            引擎更新时【不】改 IPA_CB,返回用户的 97MB IPA 保持缓存、不重下(秒开的关键)。
  const CB = Date.now();
  const IPA_CB = CB;
  window.Module = {
    canvas: $('canvas'),
    // 无参 → 走 app picker;指定 IPA + iPad 横屏右
    arguments: ['/MoleWorld.ipa', '--landscape-right', '--device-family=ipad'],
    locateFile: (p) => p + '?cb=' + CB,
    print:    (t) => addLog(t),
    printErr: (t) => addLog(t),
    onAbort:  (w) => { setStatus('已崩溃', 'err'); addLog('ABORT: ' + w); },
    onRuntimeInitialized: () => {
      setStatus('运行中', 'run'); hintEl.style.display = 'none';
      const sp = $('splash');
      if (sp) { sp.classList.add('hide'); setTimeout(() => { sp.style.display = 'none'; }, 500); }
      window.__runtimeReady = true; startAutoPersist(); refreshStatus();
    },
    preRun: [function () {
      try {
        const d = new Uint8Array(window.__ipaBuf);
        Module.FS.writeFile('/MoleWorld.ipa', d);
        addLog('[launcher] IPA 已写入 MEMFS:' + d.length + ' 字节');
      } catch (e) { addLog('[launcher] 写 IPA 失败:' + e); }
      // [存档] 把存档写进 touchHLE 的 wasm 沙盒,让离线 [GameData loadFromLocal] 读到非空庄园
      // (否则进村是空的、盖不住启动图)。__seeds = [[沙盒相对路径, 字节], ...]:优先 IndexedDB 里
      // 的玩家进度(自动保存/导入),没有才是同目录默认种子(见下方加载逻辑)。沙盒根 =
      // user_data_base_path()(wasm 上="."→CWD"/")/touchHLE_sandbox/<bundleid>/。
      try {
        const seeds = window.__seeds || [];
        if (seeds.length) {
          for (const [relpath, buf] of seeds) {
            // 纵深防御:写沙盒前再校验一次路径(挡住 IndexedDB 里可能残留的历史脏数据,防 ../ 逃逸覆盖 IPA/资源)
            if (!safeRelPath(relpath)) { addLog('[launcher] 跳过非法存档路径:' + relpath); continue; }
            const path = SBOX + '/' + relpath;
            Module.FS.mkdirTree(path.slice(0, path.lastIndexOf('/')));
            Module.FS.writeFile(path, buf instanceof Uint8Array ? buf : new Uint8Array(buf));
            addLog('[launcher] 存档写入:' + path + ' (' + (buf.byteLength || buf.length) + ' 字节)');
          }
        } else {
          addLog('[launcher] 无存档 → 进村为空');
        }
      } catch (e) { addLog('[launcher] 写存档失败:' + e); }
    }],
  };

  setupSaveManager();   // 存档管理面板接线(DOM 已就绪;FS 操作会等运行时就绪)

  // ═══════════════════════════════════════════════════════════════════════
  //  下载:三大件【并行流式】+ 启动画面进度条
  //  旧版串行:await fetch(IPA 97MB) 全下完 → 才 fetch 种子 → 才 touchHLE.js(内部再各自
  //  fetch .wasm/.data)。新版把 wasm/data/IPA 同时开下(共享带宽、去掉串行等待),下完把
  //  wasm 交 Module.wasmBinary、data 交 Module.getPreloadedPackage、IPA 留 preRun 写 MEMFS,
  //  touchHLE.js 就不再二次 fetch。进度分母用【解压后】字节:.wasm/.data 走 br/gzip,浏览器
  //  透明解压,reader 读到的是解压后字节;IPA 是 zip 不再压缩读原始字节。故用解压后大小估算,
  //  进度单调逼近 100%(略有估算,cap 99% 后 done 时补满)。
  // ═══════════════════════════════════════════════════════════════════════
  const DL = [
    { key: 'wasm', url: 'touchHLE.wasm', cb: CB,     est:  8900000, set: (b) => { Module.wasmBinary = b; } },
    { key: 'data', url: 'touchHLE.data', cb: CB,     est: 40000000, set: (b) => { window.__dataBuf = b; } },
    { key: 'ipa',  url: 'MoleWorld.ipa', cb: IPA_CB, est: 97500000, set: (b) => { window.__ipaBuf = b; } },
  ];
  const DL_TOTAL = DL.reduce((a, d) => a + d.est, 0);
  const got = Object.fromEntries(DL.map(d => [d.key, 0]));
  function paintProgress() {
    let sum = 0; for (const d of DL) sum += Math.min(got[d.key], d.est);
    const pct = Math.min(99, Math.floor(sum / DL_TOTAL * 100));
    const fill = $('sp-fill'), pctEl = $('sp-pct');
    if (fill) fill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%　·　' + (sum / 1048576).toFixed(0) + ' / ~' + Math.round(DL_TOTAL / 1048576) + ' MB';
  }
  async function streamFetch(d) {
    const resp = await fetch(d.url + '?cb=' + (d.cb || CB));
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' — ' + d.url);
    if (!resp.body || !resp.body.getReader) {   // 老浏览器无流:整体读取
      const buf = await resp.arrayBuffer(); got[d.key] = buf.byteLength; paintProgress(); d.set(buf);
      addLog('[launcher] ' + d.key + ' 就绪(整体):' + buf.byteLength + ' 字节'); return;
    }
    const reader = resp.body.getReader();
    const chunks = []; let n = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); n += value.length; got[d.key] = n; paintProgress();
    }
    const out = new Uint8Array(n); let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    d.set(out.buffer);
    addLog('[launcher] ' + d.key + ' 就绪:' + n + ' 字节');
  }
  // 种子(小):优先 IndexedDB 玩家进度(自动保存/导入),否则同目录默认种子。三件套(userinfo.dat/
  // map.dat/plist)必须配套——userinfo 是加密的,「是否加密」标志存 plist 里,少 plist 会误判存档损坏弹框 exit。
  async function loadSeeds() {
    window.__seeds = [];
    let persisted = null;
    try { persisted = await saveDB.get('player'); } catch (_) {}
    if (persisted && persisted.files && persisted.files.length) {
      for (const f of persisted.files) window.__seeds.push([f.path, f.data]);
      window.__saveSource = (persisted.source || '').startsWith('导入') ? persisted.source : '玩家进度';
      addLog('[存档] 从浏览器恢复存档:' + persisted.files.length + ' 文件(' + (persisted.created || '') + ')');
    } else {
      window.__saveSource = '默认种子';
      for (const name of ['userinfo.dat', 'map.dat', 'com.taomee.MoleWorld.plist']) {
        try {
          const r = await fetch(name + '?cb=' + CB);
          if (r.ok) { const buf = await r.arrayBuffer(); window.__seeds.push([SAVE_REL(name), new Uint8Array(buf)]);
            addLog('[launcher] 默认种子下载:' + name + ' ' + buf.byteLength + ' 字节'); }
        } catch (e) { /* 无该种子,可接受 */ }
      }
    }
  }

  (async () => {
    addLog('[launcher] 页面加载 ' + new Date().toLocaleString());
    setStatus('下载游戏数据…');
    try {
      await Promise.all([...DL.map(streamFetch), loadSeeds()]);
      // emscripten 打包器直接用预取的 .data(否则它会自己再 fetch 一遍 touchHLE.data)
      Module.getPreloadedPackage = () => window.__dataBuf;
      addLog('[launcher] 全部资源就绪,启动模拟器');
    } catch (e) {
      setStatus('加载失败', 'err');
      const note = $('sp-note'); if (note) { note.textContent = '下载失败:' + e.message + '(请刷新重试)'; note.classList.add('err'); }
      addLog('[launcher] ' + e); return;
    }
    const fill = $('sp-fill'), pctEl = $('sp-pct'), note = $('sp-note');
    if (fill) fill.style.width = '100%';
    if (pctEl) pctEl.textContent = '100%　·　下载完成';
    if (note) note.textContent = '正在初始化模拟器(首屏约十几秒)…';
    setStatus('启动模拟器…');
    const s = document.createElement('script');
    s.src = 'touchHLE.js?cb=' + CB;
    s.onerror = () => { setStatus('加载失败', 'err'); addLog('[launcher] touchHLE.js 加载失败'); };
    document.body.appendChild(s);
  })();
})();
</script>
</body>
